\* TLC 模型配置 —— N=4，Block=6（Genesis + B1..B5），MaxView=3。
\* 最小可完成模型：Block=6 允许 1 个 3-chain 提交（B1@v1→B2@v2→B3@v3）+ 分叉块（B4/B5），
\* 使 TypeOK/HonestVotePerView/QcUniquePerView/LockDominatesVotes/CommittedImpliesCertified 非空洞；
\* NoConflictCommit/NoRollback 因仅 1 个提交可达而弱非空洞（见 TLC-RESULTS.md 的诚实边界说明）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
