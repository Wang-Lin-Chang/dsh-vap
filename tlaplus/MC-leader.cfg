\* TLC 模型配置 —— 稳定诚实 leader 顺序提案（VAPConsensusLeader.tla）。
\* 用于在「部分同步 / 稳定 leader」理想化下检查 EventuallyCommit 活性（预期 PASS），
\* 对照完全对抗模型下 EventuallyCommit 的活性反例（MC-commit.cfg，预期 FAIL）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 4
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B8", "B9", "B10", "B11", "B12"}
  Genesis = "Genesis"

SPECIFICATION SpecLeader

\* ---- 安全性不变式（单一链细化下仍应全部成立）----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress
PROPERTY EventuallyCommit

CHECK_DEADLOCK FALSE
