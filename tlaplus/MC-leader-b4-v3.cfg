\* TLC 模型配置 —— 稳定诚实 leader 顺序提案（VAPConsensusLeader.tla），N=4，Block=4，MaxView=3。
\* 单一顺序链（无分叉）→ 状态空间小、可快速完成；在「部分同步/稳定 leader」理想化下
\* 检查 EventuallyCommit（预期 PASS），对照完全对抗模型下的活性反例。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3"}
  Genesis = "Genesis"

SPECIFICATION SpecLeader

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress
PROPERTY EventuallyCommit

CHECK_DEADLOCK FALSE
