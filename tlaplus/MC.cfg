\* TLC 模型配置 —— VAP 锁步 QC 链共识，N=4 有界模型。
\* N=4 → f=1 → QC = ⌈2n/3⌉ = ⌈8/3⌉ = 3 个签名者（= 2f+1）；
\* 诚实票门槛 Quorum = f+1 = 2（见 TLA-REPORT.md §2 的等价性说明）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 4
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B8", "B9", "B10", "B11", "B12"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式（全部预期通过）----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
\* ViewProgress：由 WF(ViewChange) 直接可得，预期通过。
PROPERTY ViewProgress
\* EventuallyCommit：仅在部分同步（稳定诚实 leader）下成立；在完全对抗的
\* Propose 下预期得到活性反例（活性依赖部分同步假设，见 TLA-REPORT.md §6）。
\* 因此默认注释，待"稳定诚实 leader"细化（V2）后再启用。
\* PROPERTY EventuallyCommit

\* 有界模型在视图/块域耗尽后自然停滞，不视为死锁错误。
CHECK_DEADLOCK FALSE
