\* TLC 模型配置 —— N=4，Block=3（Genesis + B1..B2），MaxView=2。
\* 最小可完成模型：允许 v1 分叉（B1/B2 兄弟）→ QcUniquePerView/LockDominatesVotes/HonestVotePerView
\* 非空洞；MaxView=2 下无 3-chain 提交 → 提交类不变式（CommittedImpliesCertified/
\* NoConflictCommit/NoRollback）在此规模为空洞（诚实边界见 TLC-RESULTS.md）。
\* 用于在状态空间规模边界内拿到一份「Model checking completed / No error」的完整安全+活性通过记录。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 2
  Block   = {"Genesis", "B1", "B2"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
