\* TLC 模型配置 —— 稳定诚实 leader 顺序提案（VAPConsensusLeader.tla），N=4，Block=5，MaxView=4。
\* V4 第三层（view-change/new-view 锚定最高 QC）验证用：比 b4-v3 多一个视图/块，
\* 使「跳视图到 3 后锚定最高 QC 提案 → 3-chain」有足够视图空间恢复提交
\*（B1@1 → B3@3 → B4@4 形成 3-chain 提交 B1）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 4
  Block   = {"Genesis", "B1", "B2", "B3", "B4"}
  Genesis = "Genesis"

SPECIFICATION SpecLeader

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress
PROPERTY EventuallyCommit

CHECK_DEADLOCK FALSE
