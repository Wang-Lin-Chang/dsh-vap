\* TLC 模型配置 —— N=4，Block=13（原稿块域），MaxView 由 4 降到 3（更快拿完整结果）。
\* Block=13 保留对抗性 Propose 的完整分叉能力；MaxView=3 仍允许完整 3-chain 提交
\* （B@v1→B1@v2→B2@v3），使提交类不变式（CommittedImpliesCertified/NoConflictCommit/
\* NoRollback）非空洞。用于拿「7 不变式 + ViewProgress」完整绿色结论。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B8", "B9", "B10", "B11", "B12"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
