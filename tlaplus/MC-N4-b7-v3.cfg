\* TLC 模型配置 —— N=4，Block=7，MaxView=3（缩减视图上界以适配 2核/3.6GB 老服务器）。
\* Block=7（Genesis + B1..B6）仍足以构造两个冲突 3-chain（A@v1→A1@v2→A2@v3 与 B@v1→B1@v2→B2@v3），
\* 使 NoConflictCommit / NoRollback 非空洞。MaxView=3 仍允许完整 3-chain 提交。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
