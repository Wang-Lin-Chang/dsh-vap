\* TLC 模型配置 —— N=4 缩减块域（Block=7），并启用 EventuallyCommit。
\* 目的：在完全对抗 Propose 下验证 EventuallyCommit（预期活性反例，见 TLA-REPORT.md §4/§6）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 4
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6"}
  Genesis = "Genesis"

SPECIFICATION Spec

