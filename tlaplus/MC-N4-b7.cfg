\* TLC 模型配置 —— N=4 缩减块域（Block=7：Genesis + B1..B6）。
\* Block=13 在 2 核 / 3.6GB 老服务器上状态空间增长（~25min 3.2M+ 状态仍增长，逼近 2GB 堆）。
\* Block=7 仍足以构造两个冲突 3-chain（Genesis → {A,B}@v1 → 子@v2 → 孙@v3，共 6 个非创世块），
\* 使 NoConflictCommit / NoRollback 非空洞；其余常量与 MC.cfg 相同。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 4
  Block   = {"Genesis", "B1", "B2", "B3", "B4", "B5", "B6"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
