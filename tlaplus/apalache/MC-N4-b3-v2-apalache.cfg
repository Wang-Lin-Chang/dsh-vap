\* Apalache 模型配置 —— N=4，Block=3（Genesis + B1..B2），MaxView=2。
\* 与 TLC 的 MC-N4-b3-v2.cfg（V4 规格完整穷举 55,188 状态 / 4min59s，全 PASS）同参数。
\* 仅保留 Apalache 支持的 INIT/NEXT/INVARIANT；不含 PROPERTY（Apalache 不做时序活性）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 2
  Block   = {"Genesis", "B1", "B2"}
  Genesis = "Genesis"

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback
