\* Apalache 模型配置 —— N=4，Block=4（Genesis + B1..B3），MaxView=3。
\* 与 TLC 的 MC-N4-b4-v3.cfg（V4 规格在 TLC 下 4,517,653 distinct 未收敛零违反）同参数。
\* 最小提交维度模型：允许 1 个 3-chain（B1@v1→B2@v2→B3@v3）提交。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3"}
  Genesis = "Genesis"

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback
