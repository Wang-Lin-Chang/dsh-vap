\* TLC 模型配置 —— N=4，Block=4（Genesis + B1..B3），MaxView=3。
\* 最小可完成模型：恰好允许 1 个 3-chain（B1@v1→B2@v2→B3@v3）提交，且可在 v1 构造分叉
\* （B1/B2 为兄弟）以非空洞检验 QcUniquePerView。NoConflictCommit/NoRollback 因仅 1 提交弱非空洞。
\* 更大的 Block（6/7/13）在 2核/3.6GB 老服务器上状态爆炸（见 TLC-RESULTS.md 状态爆炸记录）。

CONSTANT
  Nodes   = {"n1", "n2", "n3", "n4"}
  Honest  = {"n1", "n2", "n3"}
  Quorum  = 2
  MaxView = 3
  Block   = {"Genesis", "B1", "B2", "B3"}
  Genesis = "Genesis"

SPECIFICATION Spec

\* ---- 安全性不变式 ----
INVARIANT TypeOK
INVARIANT HonestVotePerView
INVARIANT QcUniquePerView
INVARIANT LockDominatesVotes
INVARIANT CommittedImpliesCertified
INVARIANT NoConflictCommit
INVARIANT NoRollback

\* ---- 活性性质 ----
PROPERTY ViewProgress

CHECK_DEADLOCK FALSE
