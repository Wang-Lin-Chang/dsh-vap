# VAP journald 尺寸控制片段（drop-in）
#
# journald 的磁盘/保留上限是**全局**配置（journald.conf），不能在单个 systemd unit 里用
# JournalMaxUse= 设置；正确做法是把本片段放进 /etc/systemd/journald.conf.d/ 下。
#
# 安装（对 vap-relay / vap-stun / vap-files 三服务的日志统一生效）：
#   sudo install -m 644 vap-journald.conf /etc/systemd/journald.conf.d/vap-journald.conf
#   sudo systemctl restart systemd-journald
#
# 效果：journal 落盘最多 500M，条目最多保留 14 天（先到先滚），防止三个常驻服务的
# 日志把 /var/log/journal 撑爆磁盘。

[Journal]
SystemMaxUse=500M
MaxRetentionSec=14day
